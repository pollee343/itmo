openapi: 3.0.3
info:
  title: Demography API
  version: 1.0.0
  description: 'REST API второго веб-сервиса для выполнения демографических операций.


    Сервис расположен по префиксу /demography и выполняет агрегирующие операции, используя API сервиса Person.'
servers:
  - url: https://se.ifmo.ru/~408951/api
    description: Helios server
  - url: http://localhost:8080
    description: Local server
tags:
  - name: Demography
    description: Демографические операции
paths:
  /demography/hair-color/{hair-color}:
    get:
      tags:
        - Demography
      summary: Получить количество людей с заданным цветом волос
      description: Возвращает количество людей с заданным цветом волос, данные о людях находятся в сервисе Person
      operationId: countPersonsByHairColor
      parameters:
        - name: hair-color
          in: path
          required: true
          description: Цвет волос
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        '200':
          description: Количество людей успешно вычислено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
              example:
                count: 25
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /demography/nationality/{nationality}/eye-color/{eye-color}:
    get:
      tags:
        - Demography
      summary: Получить количество людей по национальности и цвету глаз
      description: Возвращает количество людей с заданным цветом глаз и национальностью, данные о людях находятся в сервисе Person
      operationId: countPersonsByNationalityAndEyeColor
      parameters:
        - name: nationality
          in: path
          required: true
          description: Национальность
          schema:
            $ref: '#/components/schemas/Country'
        - name: eye-color
          in: path
          required: true
          description: Цвет глаз
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        '200':
          description: Количество людей успешно вычислено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
              example:
                count: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            code: INVALID_REQUEST
            message: invalid hair-color value
    BadGateway:
      description: Не удалось получить корректный ответ от сервиса Person.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 502
            error: Bad Gateway
            code: UPSTREAM_INVALID_RESPONSE
            message: Не удалось получить корректный ответ от сервиса Person.
    ResourceNotFound:
      description: >-
        Ресурс по запрошенному URL не найден на сервере (например, API не развёрнуто по указанному адресу).
        Ответ приложения имеет формат JSON; веб-сервер может вернуть HTML-страницу 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            resourceNotFound:
              summary: Ресурс (URL) не найден
              value:
                status: 404
                error: Not Found
                code: RESOURCE_NOT_FOUND
                message: Ресурс по запрошенному URL не найден на сервере
        text/html:
          schema:
            type: string
          examples:
            resourceNotFound:
              summary: Ресурс не найден — HTML-ответ веб-сервера
              value: '<!DOCTYPE html><html><head><title>404 Not Found</title></head><body><h1>Not Found</h1><p>The requested URL was not found on this server.</p></body></html>'
    MethodNotAllowed:
      headers:
        Allow:
          description: >-
            Обязательный список фактически разрешённых HTTP-методов для запрошенного
            маршрута через запятую. Пример приведён для маршрута только с GET;
            HEAD и OPTIONS добавляются, если сервер их поддерживает.
          required: true
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 405
            error: Method Not Allowed
            code: METHOD_NOT_ALLOWED
            message: HTTP-метод не поддерживается для данного маршрута
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 500
            error: Internal Server Error
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера
    ServiceUnavailable:
      description: Сервис временно недоступен из-за перегрузки, обслуживания или недоступности необходимой зависимости (например, БД).
      headers:
        Retry-After:
          description: Необязательное время ожидания перед повторным запросом в секундах или в формате HTTP-date.
          schema:
            type: string
          example: '60'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 503
            error: Service Unavailable
            code: SERVICE_UNAVAILABLE
            message: Сервис временно недоступен. Повторите запрос позже.
    GatewayTimeout:
      description: Время ожидания ответа от сервиса Person истекло
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 504
            error: Gateway Timeout
            code: UPSTREAM_TIMEOUT
            message: Сервис Person не ответил за отведённое время
  schemas:
    Country:
      type: string
      description: Национальность
      enum:
        - SPAIN
        - CHINA
        - VATICAN
        - NORTH_KOREA
      example: SPAIN
    Color:
      type: string
      description: Цвет волос или глаз.
      enum:
        - GREEN
        - RED
        - BLACK
        - BLUE
        - YELLOW
        - WHITE
        - BROWN
      example: BLACK
    CountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
          example: 12
    Error:
      type: object
      required:
        - status
        - error
        - code
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        code:
          type: string
          description: Машинный код причины ошибки, позволяющий различать ошибки с одинаковым HTTP-статусом.
          example: INVALID_REQUEST
        message:
          type: string
          example: Invalid request data

  
