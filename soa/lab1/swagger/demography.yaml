openapi: 3.0.3
info:
  title: Demography API
  version: 1.0.0
  description: 'REST API второго веб-сервиса для выполнения демографических операций.


    Сервис расположен по префиксу /demography и выполняет агрегирующие операции, используя API сервиса Person.'
servers:
  - url: https://se.ifmo.ru/~408951/api
    description: Helios server
  - url: http://localhost:8080
    description: Local server
tags:
  - name: Demography
    description: Демографические операции
paths:
  /demography/hair-color/{hair-color}:
    get:
      tags:
        - Demography
      summary: Получить количество людей с заданным цветом волос
      description: Возвращает количество людей с заданным цветом волос, данные о людях находятся в сервисе Person
      operationId: countPersonsByHairColor
      parameters:
        - name: hair-color
          in: path
          required: true
          description: Цвет волос
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        '200':
          description: Количество людей успешно вычислено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
              example:
                count: 25
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /demography/nationality/{nationality}/eye-color/{eye-color}:
    get:
      tags:
        - Demography
      summary: Получить количество людей по национальности и цвету глаз
      description: Возвращает количество людей с заданным цветом глаз и национальностью, данные о людях находятся в сервисе Person
      operationId: countPersonsByNationalityAndEyeColor
      parameters:
        - name: nationality
          in: path
          required: true
          description: Национальность
          schema:
            $ref: '#/components/schemas/Country'
        - name: eye-color
          in: path
          required: true
          description: Цвет глаз
          schema:
            $ref: '#/components/schemas/Color'
      responses:
        '200':
          description: Количество людей успешно вычислено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
              example:
                count: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            message: invalid hair-color value
    BadGateway:
      description: Не удалось получить корректный ответ от сервиса Person.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 502
            error: Bad Gateway
            code: UPSTREAM_INVALID_RESPONSE
            message: Не удалось получить корректный ответ от сервиса Person.
    ResourceNotFound:
      description: Маршрут не найден. Возвращается общим обработчиком для неизвестных URL.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            error: Not Found
            message: Person with id 100 not found
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 500
            error: InternalServerError
            message: Внутренняя ошибка сервера
  schemas:
    Country:
      type: string
      description: Национальность
      enum:
        - SPAIN
        - CHINA
        - VATICAN
        - NORTH_KOREA
      example: SPAIN
    Color:
      type: string
      description: Цвет волос или глаз.
      enum:
        - GREEN
        - RED
        - BLACK
        - BLUE
        - YELLOW
        - WHITE
        - BROWN
      example: BLACK
    CountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
          example: 12
    Error:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Invalid request data

  
